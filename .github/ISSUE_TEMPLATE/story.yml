name: Story
description: User-facing or business-capability work (US-*)
title: "US-XXX-00/FE — "
labels: [type:story]
body:
  - type: input
    id: story-id
    attributes:
      label: "Story ID"
      description: "The canonical id from the product backlog — e.g. `US-CAT-01`, `EN-WIRE-3`."
      placeholder: "US-CAT-01"
    validations:
      required: true
  - type: input
    id: sprint-doc
    attributes:
      label: "Sprint doc"
      description: "Link to the sprint backlog file this item is committed in."
      placeholder: "https://github.com/phuchoang-ecommerce-org/docs/blob/main/PM-docs/sprint-backlogs/sprint-06-catalog-browse.md"
  - type: textarea
    id: ac
    attributes:
      label: "Acceptance Criteria"
      description: "Given / When / Then, one per exception flow of the source use case as well as the main scenario."
      value: |
        - Given …, when …, then ….
        - Given …, when …, then ….
        - E1 — Given …, when …, then ….

    validations:
      required: true
  - type: textarea
    id: impl
    attributes:
      label: "Implementation Checklist"
      description: "The behaviour is the issue; the classes are the checklist."
      value: |
        - [ ] Domain behaviour
        - [ ] Application use case
        - [ ] Persistence / integration adapter
        - [ ] API endpoint
        - [ ] Unit tests
        - [ ] Integration tests
        - [ ] Security behaviour verified

    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: "Contract surface"
      description: "The `operationId`s and/or `ecp-web` routes this story touches."
      placeholder: |
        listCategories · getCategory
        /c/[...slug]

  - type: checkboxes
    id: dod-lane
    attributes:
      label: "Definition of Done — §4 — Frontend Slice"
      description: "Adapt to the nature of the work; this is a quality gate, not a formality. Full text: https://github.com/phuchoang-ecommerce-org/docs/blob/main/PM-docs/definition-of-done.md"
      options:
      - label: "1 — `tsc --noEmit` passes under `strict` + `noUncheckedIndexedAccess`, `exactOptionalPropertyTypes`, `verbatimModuleSyntax`"
      - label: "2 — No `any`; `unknown` plus narrowing is the sanctioned alternative"
      - label: "3 — ESLint passes, including `eslint-plugin-boundaries` (`I-1`–`I-8`) and the `dependency-cruiser` cycle check"
      - label: "4 — Generated types regenerated; the diff is empty"
      - label: "5 — A hand-written, reviewed Zod parser exists for every response the UI depends on structurally"
      - label: "6 — Vitest + Testing Library cover keyboard interaction, focus visibility, ≥ 44 px hit area; `axe` passes"
      - label: "7 — `loading.tsx` is a skeleton in the shape of the content"
      - label: "8 — Every independently-fetched section has its own `<Suspense>` boundary and degrades to its own empty state"
      - label: "9 — `error.tsx` shows the correlation id, no stack and no response body"
      - label: "10 — No arithmetic on `Money` anywhere"
      - label: "11 — No Tailwind arbitrary values, no raw hex in component source"
      - label: "12 — Rendering class (`R1`–`R4`) and cache posture match Routing §3; nothing in `(auth)`, `(account)`, `(admin)`, cart or checkout cached or indexed"
      - label: "13 — The screen renders correctly against **both** the Prism mock **and** the real `ecp-api`"
  - type: checkboxes
    id: dod-story
    attributes:
      label: "Definition of Done — the Story (§5)"
      description: "Both slices must satisfy their lane's list, and then all of these. Enforced by the `Integrated` column — a merged, green slice waits there until the gate."
      options:
      - label: "1 — The Contract Sync checklist has passed for this story's domain"
      - label: "2 — Demonstrated against the running system at a Sprint Review — not a screenshot, not a passing test"
      - label: "3 — Every acceptance criterion satisfied, exception-flow criteria included"
      - label: "4 — Any contract drift amended in `openapi.yaml`, not worked around"
      - label: "5 — Nothing left as a `TODO` that the acceptance criteria required"
  - type: markdown
    attributes:
      value: |
        Set `Work Type`, `Module`, `Priority`, `Sprint`, `Release`, `Size`, `Risk` and `Layer` on the
        **project item**, not with labels — the Project fields are the authoritative classification.
